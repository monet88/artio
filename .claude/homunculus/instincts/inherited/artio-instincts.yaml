# Artio Workflow Project Documentation Restructure

## Action

Follow the project-documentation-restructure workflow:
1. Create or update multiple markdown documentation files under docs/ (e.g., ARCHITECTURE.md, README.md, decision logs, templates).
2. Add or update scripts in scripts/ to support documentation validation or search.
3. Remove obsolete documentation or script files.
4. Update .gitignore if new documentation/script artifacts are generated.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: docs/ARCHITECTURE.md, docs/README.md, docs/decisions/README.md

